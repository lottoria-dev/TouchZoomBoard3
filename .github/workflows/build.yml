name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: 3.0.2

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build release package
        shell: pwsh
        run: ./build_release.ps1 -Version "${{ env.PACKAGE_VERSION }}"

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: TouchZoomBoard3-${{ env.PACKAGE_VERSION }}-Windows-x64
          path: |
            dist/TouchZoomBoard3.exe
            dist/TouchZoomBoard3_${{ env.PACKAGE_VERSION }}_Windows_x64.zip
            dist/TouchZoomBoard3_${{ env.PACKAGE_VERSION }}_SHA256.txt
          if-no-files-found: error
